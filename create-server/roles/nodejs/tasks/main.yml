---
- name: Download Node.js setup script
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_22.x
    dest: /tmp/node_setup
    mode: "0755"
    owner: root
    group: root

- name: Configure Node.js repository
  ansible.builtin.command: ./node_setup
  args:
    chdir: /tmp/
  changed_when: false

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
