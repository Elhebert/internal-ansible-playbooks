---
- name: Install Nginx
  ansible.builtin.apt:
    pkg: nginx
    state: present
    update_cache: true
  notify:
    - Start Nginx

- name: Add includes
  ansible.builtin.copy:
    src: includes
    dest: /etc/nginx
    owner: root
    group: root
    mode: "0644"

- name: Add Nginx Config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"

- name: Add Nginx Mime Types
  ansible.builtin.copy:
    src: mime.types
    dest: /etc/nginx/mime.types
    owner: root
    group: root
    mode: "0644"

- name: Disable Default Site
  ansible.builtin.file:
    dest: /etc/nginx/sites-enabled/default
    state: absent
